[project]
name = "medimate-ai"
version = "0.1.0"
description = "진료 메이트 AI 계층 — 문진 카드 챗봇, 온톨로지, 가드레일"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
providers = [
    "anthropic>=0.50",
    "boto3>=1.35",  # Bedrock converse. 인증은 IAM이라 API 키가 없다
    "openai>=1.50",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",  # fastapi.testclient
    # 일일 예산 경계를 KST 자정으로 본다(budget.py). 윈도우·슬림 리눅스 이미지에는
    # IANA 시간대 DB가 없어서 `ZoneInfo("Asia/Seoul")`이 실패한다
    "tzdata>=2024.1",
]
nlp = [
    "kiwipiepy>=0.23.2",
    "typesafe-sdk>=0.7.0",
]
obs = [
    "langfuse>=4.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medimate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts"]  # 기존 추출 스크립트는 별도 정리

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
